spring:
  application:
    name: remoteapp-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/remoteapp}
    username: ${DB_USERNAME:remoteapp}
    password: ${DB_PASSWORD:remoteapp}
    hikari:
      # Neon free giới hạn connection; 1 instance Render chỉ cần pool nhỏ
      maximum-pool-size: ${DB_POOL_SIZE:5}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      # Dev mặc định: mailpit localhost:1025 (mail KHÔNG tới hộp thư thật).
      # SMTP thật: đặt MAIL_SMTP_AUTH=true, MAIL_SMTP_STARTTLS=true, MAIL_FROM=<sender đã xác thực>.
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}

app:
  jwt:
    # Production: truyen qua bien moi truong JWT_SECRET (>= 32 ky tu)
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    access-token-minutes: 15
    refresh-token-days: 30
  auth:
    reset-token-minutes: 30
    login-max-attempts: 10
    login-window-seconds: 60
  timezone: ${APP_TIMEZONE:Asia/Ho_Chi_Minh}
  upload:
    dir: ${UPLOAD_DIR:uploads}
  storage:
    # local = đĩa (dev/test); supabase = object storage (prod, xem docs/plan-deploy/02)
    type: ${STORAGE_TYPE:local}
    bucket: ${STORAGE_BUCKET:remoteapp-uploads}
    base-url: ${STORAGE_BASE_URL:}
    service-key: ${STORAGE_SERVICE_KEY:}
    public-url: ${STORAGE_PUBLIC_URL:}
  fcm:
    # false -> NoopPushSender (notification vẫn lưu DB, chỉ không gửi push)
    enabled: ${FCM_ENABLED:false}
    credentials-base64: ${FCM_CREDENTIALS_BASE64:}
  reminder:
    # chu kỳ quét nhắc deadline; lưới an toàn là dedupe_key UNIQUE
    interval-ms: ${REMINDER_INTERVAL_MS:300000}
    # hoãn lần quét đầu (tránh chạy ngay khi app/test vừa khởi động)
    initial-delay-ms: ${REMINDER_INITIAL_DELAY_MS:60000}
  mail:
    # Địa chỉ gửi (From) của email hệ thống. SMTP thật: dùng sender đã xác thực (SPF/DKIM).
    from: ${MAIL_FROM:no-reply@remoteapp.local}

server:
  # Render inject biến PORT; local không có PORT -> 8080; SERVER_PORT vẫn override được khi dev
  port: ${SERVER_PORT:${PORT:8080}}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    # Prod chưa cấu hình SMTP -> mail health indicator sẽ làm /actuator/health = DOWN
    # và Render health check fail. Tắt indicator này (email lỗi không phải lỗi hệ thống).
    mail:
      enabled: false
