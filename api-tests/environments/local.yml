name: local
variables:
  - name: baseUrl
    value: http://127.0.0.1:8080
    description: Backend base URL. Local = loopback (chạy `cd backend && ./mvnw spring-boot:run`); các target khác lấy từ tài liệu deploy.
  - name: inputEmailA
    value: huynh696k@gmail.com
    description: Email tài khoản A — BẠN nhập/sửa (không script nào ghi vào biến này). Chạy lại cả collection cần email mới hoặc DB sạch, nếu không request 01 trả 409.
  - name: inputEmailB
    value: lolvn404@gmail.com
    description: Email tài khoản B — BẠN nhập/sửa. Phải KHÁC inputEmailA, nếu không request 02 trả 409. File này được commit — dùng *.local.yml (đã gitignore) nếu không muốn email cá nhân lên git.
  - name: inputShortPwEmail
    value: short-pw@example.com
    description: Email riêng cho request 24 (mật khẩu < 8 ký tự) — BẠN nhập/sửa; mật khẩu ngắn bị chặn trước khi kiểm trùng email nên email này không cần tồn tại.
  - secret: true
    name: inputPasswordA
    description: Mật khẩu tài khoản A (>= 8 ký tự) — BẠN nhập ở tab Secret Variables. Không script nào tự điền hộ.
  - secret: true
    name: inputPasswordB
    description: Mật khẩu tài khoản B (>= 8 ký tự) — BẠN nhập ở tab Secret Variables.
  - secret: true
    name: inputNewPasswordA
    description: Mật khẩu mới cho request 11 (đổi mật khẩu, >= 8 ký tự) — BẠN nhập ở tab Secret Variables.
  - name: inputResetToken
    value: ""
    description: Token đặt lại mật khẩu lấy từ email — mở mailpit UI http://localhost:8025, xem tin của request 08, copy phần sau `app://reset?token=` rồi dán vào đây. BẠN nhập; request 27 dùng biến này (không script nào ghi).
  - secret: true
    name: inputResetPassword
    description: Mật khẩu mới đặt lại qua email cho request 27 (>= 8 ký tự) — BẠN nhập ở tab Secret Variables.
  - name: inputFcmToken
    value: fcm-device-1
    description: FCM token giả cho request 09/10 — BẠN nhập/sửa (DB unique theo token; gửi lại cùng token là upsert).
  - name: projectId
    value: ""
    description: KẾT QUẢ request 12 bắt vào runtime (không phải biến đầu vào). Điền sẵn ở đây cũng được — script chỉ ghi khi biến này đang trống.
  - name: projectBId
    value: ""
    description: KẾT QUẢ request 26 bắt vào runtime.
  - name: inviteCode
    value: ""
    description: KẾT QUẢ request 15 bắt vào runtime.
