info:
  name: 06 - Users - Me unauthorized
  type: http
  seq: 6
  tags:
  - users
  - negative
http:
  method: GET
  url: "{{baseUrl}}/api/v1/users/me"
  auth: inherit
runtime:
  scripts:
  - type: tests
    code: |
      test("HTTP 401 expected", function () {
        expect(res.status).to.equal(401);
      });
      test("mã lỗi AUTH_UNAUTHORIZED", function () {
        expect(res.body.code).to.equal("AUTH_UNAUTHORIZED");
      });
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5
docs: |-
  Read-only, negative test: gọi endpoint bảo vệ mà không có Bearer token.
