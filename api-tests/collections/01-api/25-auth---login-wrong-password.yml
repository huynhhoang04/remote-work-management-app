info:
  name: 25 - Auth - Login wrong password (401)
  type: http
  seq: 25
  tags:
  - auth
  - negative
http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/login"
  headers:
  - name: Content-Type
    value: application/json
  auth: inherit
  body:
    type: json
    data: |-
      {
        "email": "{{inputEmailA}}",
        "password": "definitely-wrong-999"
      }
runtime:
  scripts:
  - type: tests
    code: |
      test("HTTP 401 expected", function () {
        expect(res.status).to.equal(401);
      });
      test("mã lỗi AUTH_INVALID_CREDENTIALS", function () {
        expect(res.body.code).to.equal("AUTH_INVALID_CREDENTIALS");
      });
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5
docs: |-
  SIDE EFFECT: không có (chỉ tính vào rate limit 10 lần/phút/email).
  Sai mật khẩu trả cùng một lỗi chung, không tiết lộ email có tồn tại hay không.
