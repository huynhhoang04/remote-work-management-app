info:
  name: 17 - Projects - Members
  type: http
  seq: 17
  tags:
  - projects
http:
  method: GET
  url: "{{baseUrl}}/api/v1/projects/{{projectId}}/members"
  headers:
  - name: Authorization
    value: "Bearer {{tokenA}}"
  auth: inherit
runtime:
  scripts:
  - type: tests
    code: |
      function readVar(name) {
        try { const v = bru.getVar(name); if (v) return v; } catch (e) {}
        return bru.getEnvVar(name);
      }

      test("HTTP 200 expected", function () {
        expect(res.status).to.equal(200);
      });
      test("dự án có 2 thành viên", function () {
        expect(res.body.length).to.be.at.least(2);
      });
      test("A là OWNER, B là MEMBER trong cùng dự án này", function () {
        const rowA = res.body.filter(function (m) { return m.userId === readVar("userAId"); })[0];
        const rowB = res.body.filter(function (m) { return m.userId === readVar("userBId"); })[0];
        expect(rowA.role).to.equal("OWNER");
        expect(rowB.role).to.equal("MEMBER");
      });
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5
docs: |-
  Read-only. Vai trò nằm ở bản ghi thành viên dự án (project_members) — cùng một tài khoản
  có vai trò khác nhau ở các dự án khác nhau.
