info:
  name: 23 - Auth - Register duplicate email (409)
  type: http
  seq: 23
  tags:
  - auth
  - negative
http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/register"
  headers:
  - name: Content-Type
    value: application/json
  auth: inherit
  body:
    type: json
    data: |-
      {
        "email": "{{inputEmailA}}",
        "password": "{{inputPasswordA}}",
        "fullName": "Trung email"
      }
runtime:
  scripts:
  - type: tests
    code: |
      test("HTTP 409 expected", function () {
        expect(res.status).to.equal(409);
      });
      test("mã lỗi USER_EMAIL_EXISTS", function () {
        expect(res.body.code).to.equal("USER_EMAIL_EXISTS");
      });
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5
docs: |-
  SIDE EFFECT: không có — bị từ chối trước khi ghi DB.
  Điều kiện: {{inputEmailA}} đã tồn tại trong DB (chạy request 01 trước, hoặc trỏ vào email đã đăng ký).
  Nếu chạy một mình với DB sạch / mật khẩu trống, API trả 400 (validate) thay vì 409 — đúng như thiết kế.
