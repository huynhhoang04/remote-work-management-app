info:
  name: 11 - Users - Change password
  type: http
  seq: 11
  tags:
  - users
http:
  method: POST
  url: "{{baseUrl}}/api/v1/users/me/password"
  headers:
  - name: Content-Type
    value: application/json
  - name: Authorization
    value: "Bearer {{tokenA}}"
  auth: inherit
  body:
    type: json
    data: |-
      {
        "oldPassword": "{{inputPasswordA}}",
        "newPassword": "{{inputNewPasswordA}}"
      }
runtime:
  scripts:
  - type: tests
    code: |
      test("HTTP 204 expected", function () {
        expect(res.status).to.equal(204);
      });
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5
docs: |-
  SIDE EFFECT: đổi mật khẩu tài khoản A + THU HỒI TOÀN BỘ refresh token của tài khoản này.
  Sau request này {{refreshTokenA}} không dùng lại được; access token hiện tại vẫn hợp lệ tới khi hết hạn.
  Cả mật khẩu cũ và mật khẩu mới đều lấy từ environment do BẠN nhập (tab Secret Variables).
