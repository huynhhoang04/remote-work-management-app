info:
  name: 08 - Auth - Forgot password
  type: http
  seq: 8
  tags:
  - auth
http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/forgot-password"
  headers:
  - name: Content-Type
    value: application/json
  auth: inherit
  body:
    type: json
    data: |-
      {
        "email": "{{inputEmailA}}"
      }
runtime:
  scripts:
  - type: tests
    code: |
      test("HTTP 204 expected", function () {
        expect(res.status).to.equal(204);
      });
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5
docs: |-
  SIDE EFFECT: sinh token đặt lại mật khẩu + gửi email qua SMTP (dev: mailpit http://localhost:8025).
  Endpoint luôn trả 204 kể cả email không tồn tại (không lộ email đã đăng ký).
