info:
  name: 24 - Auth - Register short password (400)
  type: http
  seq: 24
  tags:
  - auth
  - negative
http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/register"
  headers:
  - name: Content-Type
    value: application/json
  auth: inherit
  body:
    type: json
    data: |-
      {
        "email": "{{inputShortPwEmail}}",
        "password": "short77",
        "fullName": "Mat khau ngan"
      }
runtime:
  scripts:
  - type: tests
    code: |
      test("HTTP 400 expected", function () {
        expect(res.status).to.equal(400);
      });
      test("mã lỗi VALIDATION_ERROR", function () {
        expect(res.body.code).to.equal("VALIDATION_ERROR");
      });
      test("báo đúng trường password", function () {
        expect(res.body.message).to.contain("password");
      });
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5
docs: |-
  SIDE EFFECT: không có. Mật khẩu 7 ký tự bị Jakarta Validation chặn ở tầng DTO
  (RegisterRequest @Size(min = 8, max = 72)) trước khi vào service — email sai/trùng cũng không quan trọng.
  Sửa mật khẩu trong body để thử độ dài khác (ví dụ 8 ký tự sẽ đăng ký thành công).
