info:
  name: 38 - Tasks - Change status DOING
  type: http
  seq: 38
  tags:
  - tasks
http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/tasks/{{taskId}}/status"
  headers:
  - name: Content-Type
    value: "application/json"
  - name: Authorization
    value: "Bearer {{tokenA}}"
  auth: inherit
  body:
    type: json
    data: |-
      {
        "status": "DOING"
      }
