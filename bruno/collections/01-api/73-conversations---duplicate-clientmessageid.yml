info:
  name: 73 - Conversations - Duplicate clientMessageId
  type: http
  seq: 73
  tags:
  - chat
http:
  method: POST
  url: "{{baseUrl}}/api/v1/conversations/{{directConversationId}}/messages"
  headers:
  - name: Content-Type
    value: "application/json"
  - name: Authorization
    value: "Bearer {{tokenA}}"
  auth: inherit
  body:
    type: json
    data: |-
      {
        "content": "Tin nhan rieng",
        "clientMessageId": "33333333-3333-3333-3333-333333333333"
      }
runtime:
  scripts:
  - type: tests
    code: |
      function readVar(name) {
        try { var v = bru.getVar(name); if (v) return v; } catch (e) {}
        return bru.getEnvVar(name);
      }
      
      test("HTTP 201 expected", function () {
        expect(res.status).to.equal(201);
      });
      test("trả lại tin cũ, không tạo trùng", function () { expect(res.body.id).to.equal(readVar("directMessageId")); });
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5
docs: |-
  SIDE EFFECT (idempotent): retry cùng clientMessageId trả về tin cũ.
