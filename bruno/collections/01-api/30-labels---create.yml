info:
  name: 30 - Labels - Create
  type: http
  seq: 30
  tags:
  - labels
http:
  method: POST
  url: "{{baseUrl}}/api/v1/projects/{{projectId}}/labels"
  headers:
  - name: Content-Type
    value: "application/json"
  - name: Authorization
    value: "Bearer {{tokenA}}"
  auth: inherit
  body:
    type: json
    data: |-
      {
        "name": "Bug",
        "color": "#ff0000"
      }
runtime:
  scripts:
  - type: after-response
    code: |
      if (res.body && res.body.id) bru.setVar("labelId", res.body.id);
  - type: tests
    code: |
      function readVar(name) {
        try { var v = bru.getVar(name); if (v) return v; } catch (e) {}
        return bru.getEnvVar(name);
      }
      
      test("HTTP 201 expected", function () {
        expect(res.status).to.equal(201);
      });
      test("đúng tên nhãn", function () { expect(res.body.name).to.equal("Bug"); });
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5
docs: |-
  SIDE EFFECT: tạo nhãn Bug trong dự án A.
