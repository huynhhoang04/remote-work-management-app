info:
  name: 50 - Attachments - Upload
  type: http
  seq: 50
  tags:
  - attachments
http:
  method: POST
  url: "{{baseUrl}}/api/v1/tasks/{{taskId}}/attachments"
  headers:
  - name: Authorization
    value: "Bearer {{tokenA}}"
  auth: inherit
  body:
    type: multipart-form
    data:
    - name: file
      type: file
      value:
      - "{{inputUploadFile}}"
      contentType: text/plain
runtime:
  scripts:
  - type: after-response
    code: |
      if (res.body && res.body.id) bru.setVar("attachmentId", res.body.id);
  - type: tests
    code: |
      function readVar(name) {
        try { var v = bru.getVar(name); if (v) return v; } catch (e) {}
        return bru.getEnvVar(name);
      }
      
      test("HTTP 201 expected", function () {
        expect(res.status).to.equal(201);
      });
      test("file có kích thước > 0", function () { expect(res.body.size).to.be.above(0); });
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5
docs: |-
  SIDE EFFECT: upload file đính kèm (multipart). {{inputUploadFile}} là đường dẫn file do BẠN nhập;
  run.sh tự trỏ tới bruno/fixtures/sample.txt.
