info:
  name: 70 - Conversations - Create direct
  type: http
  seq: 70
  tags:
  - chat
http:
  method: POST
  url: "{{baseUrl}}/api/v1/conversations"
  headers:
  - name: Content-Type
    value: "application/json"
  - name: Authorization
    value: "Bearer {{tokenA}}"
  auth: inherit
  body:
    type: json
    data: |-
      {
        "userId": "{{userBId}}"
      }
runtime:
  scripts:
  - type: after-response
    code: |
      if (res.body && res.body.id) bru.setVar("directConversationId", res.body.id);
  - type: tests
    code: |
      function readVar(name) {
        try { var v = bru.getVar(name); if (v) return v; } catch (e) {}
        return bru.getEnvVar(name);
      }
      
      test("HTTP 200 expected", function () {
        expect(res.status).to.equal(200);
      });
      test("là hội thoại DIRECT", function () { expect(res.body.type).to.equal("DIRECT"); });
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5
docs: |-
  SIDE EFFECT (idempotent): tạo/lấy hội thoại 1-1 theo cặp user.
