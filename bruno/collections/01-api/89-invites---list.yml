info:
  name: 89 - Invites - List
  type: http
  seq: 89
  tags:
  - invites
http:
  method: GET
  url: "{{baseUrl}}/api/v1/projects/{{projectId}}/invites"
  headers:
  - name: Authorization
    value: "Bearer {{tokenA}}"
  auth: inherit
runtime:
  scripts:
  - type: tests
    code: |
      function readVar(name) {
        try { var v = bru.getVar(name); if (v) return v; } catch (e) {}
        return bru.getEnvVar(name);
      }
      
      test("HTTP 200 expected", function () {
        expect(res.status).to.equal(200);
      });
      test("chứa link vừa tạo", function () { var id = readVar("inviteId2"); expect(res.body.some(function (i) { return i.id === id; })).to.equal(true); });
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5
docs: |-
  Read-only.
