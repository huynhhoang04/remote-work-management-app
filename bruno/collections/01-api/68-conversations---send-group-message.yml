info:
  name: 68 - Conversations - Send group message
  type: http
  seq: 68
  tags:
  - chat
http:
  method: POST
  url: "{{baseUrl}}/api/v1/conversations/{{groupConversationId}}/messages"
  headers:
  - name: Content-Type
    value: "application/json"
  - name: Authorization
    value: "Bearer {{tokenA}}"
  auth: inherit
  body:
    type: json
    data: |-
      {
        "content": "Chao ca nha",
        "clientMessageId": "22222222-2222-2222-2222-222222222222"
      }
runtime:
  scripts:
  - type: after-response
    code: |
      if (res.body && res.body.id) bru.setVar("messageId", res.body.id);
  - type: tests
    code: |
      function readVar(name) {
        try { var v = bru.getVar(name); if (v) return v; } catch (e) {}
        return bru.getEnvVar(name);
      }
      
      test("HTTP 201 expected", function () {
        expect(res.status).to.equal(201);
      });
      test("đúng nội dung", function () { expect(res.body.content).to.equal("Chao ca nha"); });
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5
docs: |-
  SIDE EFFECT: gửi tin vào kênh GROUP (broadcast WS + thông báo cho thành viên khác).
