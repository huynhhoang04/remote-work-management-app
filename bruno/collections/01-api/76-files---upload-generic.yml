info:
  name: 76 - Files - Upload generic
  type: http
  seq: 76
  tags:
  - files
http:
  method: POST
  url: "{{baseUrl}}/api/v1/files?projectId={{projectId}}"
  headers:
  - name: Authorization
    value: "Bearer {{tokenA}}"
  auth: inherit
  body:
    type: multipart-form
    data:
    - name: file
      type: file
      value:
      - "{{inputUploadFile}}"
      contentType: text/plain
runtime:
  scripts:
  - type: after-response
    code: |
      if (res.body && res.body.id) bru.setVar("fileId", res.body.id);
  - type: tests
    code: |
      function readVar(name) {
        try { var v = bru.getVar(name); if (v) return v; } catch (e) {}
        return bru.getEnvVar(name);
      }
      
      test("HTTP 201 expected", function () {
        expect(res.status).to.equal(201);
      });
      test("trả URL tải", function () { expect(res.body.url).to.contain(res.body.id); });
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5
docs: |-
  SIDE EFFECT: upload file gắn dự án (multipart).
