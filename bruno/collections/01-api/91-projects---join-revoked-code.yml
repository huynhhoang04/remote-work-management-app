info:
  name: 91 - Projects - Join revoked code
  type: http
  seq: 91
  tags:
  - invites
  - negative
http:
  method: POST
  url: "{{baseUrl}}/api/v1/projects/join"
  headers:
  - name: Content-Type
    value: "application/json"
  - name: Authorization
    value: "Bearer {{tokenC}}"
  auth: inherit
  body:
    type: json
    data: |-
      {
        "code": "{{inviteCode2}}"
      }
runtime:
  scripts:
  - type: tests
    code: |
      function readVar(name) {
        try { var v = bru.getVar(name); if (v) return v; } catch (e) {}
        return bru.getEnvVar(name);
      }
      
      test("HTTP 400 expected", function () {
        expect(res.status).to.equal(400);
      });
      test("mã lỗi link mời", function () { expect(res.body.code).to.equal("INVITE_INVALID"); });
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5
docs: |-
  Negative test: link đã thu hồi → 400 (C vẫn ngoài dự án).
