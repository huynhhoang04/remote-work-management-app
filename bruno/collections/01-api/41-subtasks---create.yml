info:
  name: 41 - Subtasks - Create
  type: http
  seq: 41
  tags:
  - subtasks
http:
  method: POST
  url: "{{baseUrl}}/api/v1/tasks/{{taskId}}/subtasks"
  headers:
  - name: Content-Type
    value: "application/json"
  - name: Authorization
    value: "Bearer {{tokenA}}"
  auth: inherit
  body:
    type: json
    data: |-
      {
        "title": "Checklist 1"
      }
runtime:
  scripts:
  - type: after-response
    code: |
      if (res.body && res.body.id) bru.setVar("subtaskId", res.body.id);
  - type: tests
    code: |
      function readVar(name) {
        try { var v = bru.getVar(name); if (v) return v; } catch (e) {}
        return bru.getEnvVar(name);
      }
      
      test("HTTP 201 expected", function () {
        expect(res.status).to.equal(201);
      });
      test("là subtask của task chính", function () { expect(res.body.parentTaskId).to.equal(readVar("taskId")); });
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5
docs: |-
  SIDE EFFECT: tạo checklist con (1 cấp).
