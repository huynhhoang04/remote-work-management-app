info:
  name: 96 - Audit - Filter by action
  type: http
  seq: 96
  tags:
  - audit
http:
  method: GET
  url: "{{baseUrl}}/api/v1/projects/{{projectId}}/audit-logs?action=TASK_CREATED&page=0&size=20"
  headers:
  - name: Authorization
    value: "Bearer {{tokenA}}"
  auth: inherit
runtime:
  scripts:
  - type: tests
    code: |
      function readVar(name) {
        try { var v = bru.getVar(name); if (v) return v; } catch (e) {}
        return bru.getEnvVar(name);
      }
      
      test("HTTP 200 expected", function () {
        expect(res.status).to.equal(200);
      });
      test("có log", function () { expect(res.body.content.length).to.be.at.least(1); });
      test("lọc đúng action", function () { expect(res.body.content.every(function (e) { return e.action === "TASK_CREATED"; })).to.equal(true); });
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5
docs: |-
  Read-only: chỉ OWNER xem được audit log (FR-G05).
