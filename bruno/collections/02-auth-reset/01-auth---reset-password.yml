info:
  name: 01 - Auth - Reset password (token from email)
  type: http
  seq: 1
  tags:
  - auth
  - manual
http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/reset-password"
  headers:
  - name: Content-Type
    value: application/json
  auth: inherit
  body:
    type: json
    data: |-
      {
        "token": "{{inputResetToken}}",
        "newPassword": "{{inputResetPassword}}"
      }
runtime:
  scripts:
  - type: tests
    code: |
      test("HTTP 204 expected", function () {
        expect(res.status).to.equal(204);
      });
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5
docs: |-
  SIDE EFFECT: đặt lại mật khẩu + THU HỒI toàn bộ refresh token của tài khoản sở hữu token.
  Đây là collection CHẠY TAY (cần token lấy từ email), nên không nằm trong smoke suite `run.sh`.

  Cách lấy token:
  1. Chạy request 08 (forgot password) ở collection 01.
  2. Mở mailpit http://localhost:8025 → mở email → copy phần sau `app://reset?token=`.
  3. Dán vào biến `inputResetToken` (tab Vars), đặt `inputResetPassword` (>= 8 ký tự,
     tab Secret Variables) rồi Send.

  Token dùng MỘT lần, hết hạn sau 30 phút; dùng lại trả 400 RESET_TOKEN_INVALID.
